name: StylePort
options:
  bundleIdPrefix: com.styleport
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.0.1
    SWIFT_VERSION: 6.0
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
targets:
  StylePort:
    type: application
    platform: iOS
    sources:
      - path: StylePort
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.styleport.app
        PRODUCT_NAME: StylePort
        INFOPLIST_FILE: StylePort/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
    dependencies:
      - target: StylePortShareExtension
        embed: true
      - target: StylePortActionExtension
        embed: true
  StylePortShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: StylePortShareExtension/ShareViewController.swift
      - path: StylePort/Core
      - path: StylePort/Models/LibraryModels.swift
      - path: StylePort/Models/PhotoModels.swift
      - path: StylePort/Services/PhotoConversionService.swift
      - path: StylePort/Services/PhotoLibraryWriter.swift
      - path: StylePort/Services/ExternalPhotoConversion.swift
      - path: StylePort/Resources/Styles3Template.bin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.styleport.app.share
        INFOPLIST_FILE: StylePortShareExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  StylePortActionExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: StylePortActionExtension/Assets.xcassets
      - path: StylePortShareExtension/ShareViewController.swift
      - path: StylePort/Core
      - path: StylePort/Models/LibraryModels.swift
      - path: StylePort/Models/PhotoModels.swift
      - path: StylePort/Services/PhotoConversionService.swift
      - path: StylePort/Services/PhotoLibraryWriter.swift
      - path: StylePort/Services/ExternalPhotoConversion.swift
      - path: StylePort/Resources/Styles3Template.bin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.styleport.app.action
        INFOPLIST_FILE: StylePortActionExtension/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: ActionIcon
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  StylePortTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StylePortTests
    dependencies:
      - target: StylePort
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.styleport.tests
        GENERATE_INFOPLIST_FILE: YES
  StylePortUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: StylePortUITests
    dependencies:
      - target: StylePort
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.styleport.uitests
        GENERATE_INFOPLIST_FILE: YES
